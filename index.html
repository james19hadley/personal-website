<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ZIJH (Ivan Zharov) - Personal website & developer portfolio placeholder. TU Darmstadt student.">
  <title>ZIJH // Coming Soon</title>
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    /* CSS Variables & Theme Reset */
    :root {
      --bg-color: #080b11;
      --card-bg: rgba(13, 20, 35, 0.45);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --accent-violet: #8b5cf6;
      --accent-cyan: #06b6d4;
      --terminal-bg: rgba(5, 8, 16, 0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Subtle background ambient glows */
    .glow-container {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 0;
      overflow: hidden;
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.15;
      animation: float 12s infinite alternate ease-in-out;
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: var(--accent-violet);
      top: -100px;
      left: -100px;
    }

    .orb-2 {
      width: 500px;
      height: 500px;
      background: var(--accent-cyan);
      bottom: -150px;
      right: -150px;
      animation-delay: -6s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 40px) scale(1.1); }
    }

    /* Main Container with Glassmorphism */
    .container {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 560px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      text-align: center;
      animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header Identity */
    .brand-monogram {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #ffffff 0%, #a78bfa 50%, #22d3ee 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      display: inline-block;
    }

    .subtitle {
      font-size: 1.2rem;
      font-weight: 400;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    /* Pulsing status indicator */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 32px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      position: relative;
    }

    .pulse-dot::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #10b981;
      top: 0;
      left: 0;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.5); opacity: 0; }
    }

    /* Mock Terminal Widget */
    .terminal {
      background: var(--terminal-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 18px;
      text-align: left;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      margin-bottom: 32px;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .terminal-header {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-r { background: #ef4444; }
    .dot-y { background: #f59e0b; }
    .dot-g { background: #10b981; }

    .terminal-line {
      color: var(--text-secondary);
    }

    .terminal-line span.cmd {
      color: var(--accent-cyan);
    }

    .terminal-line span.comment {
      color: #6b7280;
    }

    .terminal-line span.output {
      color: #e5e7eb;
    }

    /* Cursor animation */
    .cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: var(--accent-cyan);
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      from, to { background: transparent }
      50% { background: var(--accent-cyan) }
    }

    /* Social and Contact Links */
    .links {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      padding: 8px 16px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
    }

    .link-btn:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }

    .link-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="glow-container">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>

  <div class="container">
    <div class="brand-monogram">ZIJH</div>
    <div class="subtitle">Ivan Zharov // Ivan James Hadley</div>

    <div class="status-badge">
      <div class="pulse-dot"></div>
      <span>📡 Claiming zijh.pages.dev</span>
    </div>

    <div class="terminal">
      <div class="terminal-header">
        <div class="dot dot-r"></div>
        <div class="dot dot-y"></div>
        <div class="dot dot-g"></div>
      </div>
      <div class="terminal-line"><span class="cmd">zijh ~ $</span> whoami</div>
      <div class="terminal-line"><span class="output">Ivan Zharov, final-semester student at TU Darmstadt.</span></div>
      <div class="terminal-line"><span class="cmd">zijh ~ $</span> status --project</div>
      <div class="terminal-line"><span class="output">> Architecting bento layout & terminal CLI interfaces.</span></div>
      <div class="terminal-line"><span class="output">> Deploying soon to Cloudflare Pages...</span></div>
      <div class="terminal-line"><span class="cmd">zijh ~ $</span> <span class="cursor"></span></div>
    </div>

    <div class="links">
      <a class="link-btn" href="https://github.com/james19hadley" target="_blank" rel="noopener noreferrer">
        <!-- GitHub Icon -->
        <svg viewBox="0 0 24 24">

        </svg>
        <span>GitHub</span>
      </a>
      <a class="link-btn" href="mailto:ging19freecss@gmail.com">
        <!-- Email Icon -->
        <svg viewBox="0 0 24 24">
          <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
        <span>Contact</span>
      </a>
    </div>
  </div>

</body>
</html>
