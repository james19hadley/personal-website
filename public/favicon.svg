<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    
    <!-- Neon Cyan Glow -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Emerald Glow -->
    <filter id="glowEmerald" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="16" />
  
  <!-- Sleek Code prompt symbol -->
  <path d="M 120 156 L 240 256 L 120 356" fill="none" stroke="#06b6d4" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowCyan)" />

  <!-- Terminal flashing cursor block -->
  <rect x="270" y="316" width="100" height="40" rx="8" fill="#10b981" filter="url(#glowEmerald)" />
</svg>